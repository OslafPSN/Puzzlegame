<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gem Crush - Match 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 500px;
  padding: 8px 12px;
}

#header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

#header h1 {
  font-size: clamp(20px, 6vw, 28px);
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-box {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 4px 10px;
  text-align: center;
  min-width: 70px;
}

.stat-box .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.7;
}

.stat-box .value {
  font-size: clamp(16px, 5vw, 22px);
  font-weight: bold;
}

#stats-row {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
}

#board-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(100, 60, 255, 0.3);
  border: 2px solid rgba(255,255,255,0.15);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

#level-bar-container {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  height: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
}

#level-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  border-radius: 8px;
  transition: width 0.4s ease;
}

#level-text {
  font-size: 11px;
  opacity: 0.7;
  text-align: center;
}

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(24px, 7vw, 36px);
  font-weight: bold;
  pointer-events: none;
  opacity: 0;
  text-shadow: 0 0 20px rgba(255,200,0,0.8);
  z-index: 10;
  white-space: nowrap;
  transition: opacity 0.3s, transform 0.3s;
}

#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 20;
  border-radius: 12px;
}

#overlay.hidden { display: none; }

#overlay h2 {
  font-size: clamp(24px, 8vw, 36px);
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#overlay p {
  font-size: clamp(14px, 4vw, 18px);
  opacity: 0.8;
}

#overlay button {
  padding: 12px 40px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s;
}

#overlay button:hover {
  transform: scale(1.05);
}

#combo-display {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: clamp(14px, 4vw, 20px);
  font-weight: bold;
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  color: #ffd200;
  transition: opacity 0.2s;
}

#sound-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 20px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
  line-height: 1;
}

#sound-toggle:hover {
  background: rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <h1>Gem Crush</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="sound-toggle" title="Toggle sound">&#x1f50a;</button>
      <div class="stat-box">
        <div class="label">Score</div>
        <div class="value" id="score-display">0</div>
      </div>
    </div>
  </div>
  <div id="stats-row">
    <div class="stat-box">
      <div class="label">Level</div>
      <div class="value" id="level-display">1</div>
    </div>
    <div class="stat-box">
      <div class="label">Moves</div>
      <div class="value" id="moves-display">30</div>
    </div>
    <div class="stat-box">
      <div class="label">Best</div>
      <div class="value" id="best-display">0</div>
    </div>
  </div>
  <div id="level-text">Score 1000 to reach Level 2</div>
  <div id="level-bar-container">
    <div id="level-bar"></div>
  </div>
  <div id="board-wrapper">
    <canvas id="board"></canvas>
    <div id="message"></div>
    <div id="combo-display"></div>
    <div id="overlay">
      <h2 id="overlay-title">Gem Crush</h2>
      <p id="overlay-text">Swap gems to match 3 or more!</p>
      <button id="overlay-btn">Play</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// GEM CRUSH - Match 3 Game
// ============================================================

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// ============================================================
// Sound Engine (Web Audio API - no external files)
// ============================================================

let audioCtx = null;
let soundEnabled = true;
const soundToggleBtn = document.getElementById('sound-toggle');

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type, volume, rampDown) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    if (rampDown !== false) {
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    }
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playNoise(duration, volume) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.5;
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume || 0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 3000;
    filter.Q.value = 0.5;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
  } catch(e) {}
}

const SFX = {
  select: function() {
    playTone(880, 0.08, 'sine', 0.1);
  },
  swap: function() {
    playTone(440, 0.06, 'sine', 0.1);
    setTimeout(function() { playTone(554, 0.06, 'sine', 0.1); }, 50);
  },
  badSwap: function() {
    playTone(200, 0.15, 'square', 0.08);
    setTimeout(function() { playTone(160, 0.2, 'square', 0.08); }, 80);
  },
  match: function(combo) {
    // Rising pitch per combo
    var base = 523 + (combo - 1) * 80;
    playTone(base, 0.12, 'sine', 0.13);
    setTimeout(function() { playTone(base * 1.25, 0.12, 'sine', 0.13); }, 60);
    setTimeout(function() { playTone(base * 1.5, 0.15, 'sine', 0.10); }, 120);
    playNoise(0.1, 0.04);
  },
  drop: function() {
    playTone(180, 0.15, 'sine', 0.06);
  },
  levelUp: function() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(n, i) {
      setTimeout(function() { playTone(n, 0.2, 'sine', 0.12); }, i * 100);
    });
  },
  gameOver: function() {
    var notes = [440, 370, 311, 262];
    notes.forEach(function(n, i) {
      setTimeout(function() { playTone(n, 0.3, 'triangle', 0.12); }, i * 150);
    });
  },
  buttonClick: function() {
    playTone(660, 0.06, 'sine', 0.1);
    setTimeout(function() { playTone(880, 0.08, 'sine', 0.1); }, 40);
  },
};

soundToggleBtn.addEventListener('click', function() {
  ensureAudio();
  soundEnabled = !soundEnabled;
  soundToggleBtn.innerHTML = soundEnabled ? '&#x1f50a;' : '&#x1f507;';
});

// --- Board dimensions ---
const COLS = 8;
const ROWS = 8;

// Internal canvas resolution (high-res for crisp rendering)
const CELL = 64;
const PAD = 5;
const GEM_SIZE = CELL - PAD * 2;
const BOARD_PX = COLS * CELL; // 512

canvas.width = BOARD_PX;
canvas.height = BOARD_PX;

// Gem types with colors and shapes
const GEM_TYPES = [
  { name: 'ruby',     fill: '#e74c3c', stroke: '#ff8a80', glow: '#ff6b6b', shape: 'diamond'  },
  { name: 'emerald',  fill: '#2ecc71', stroke: '#81ffa8', glow: '#69ff9b', shape: 'circle'   },
  { name: 'sapphire', fill: '#3498db', stroke: '#90caf9', glow: '#6bc1ff', shape: 'square'   },
  { name: 'topaz',    fill: '#f39c12', stroke: '#ffd54f', glow: '#ffbe45', shape: 'triangle' },
  { name: 'amethyst', fill: '#9b59b6', stroke: '#ce93d8', glow: '#c98bde', shape: 'hexagon'  },
  { name: 'pearl',    fill: '#dfe6e9', stroke: '#ffffff', glow: '#ffffff', shape: 'star'     },
];

// --- Game State ---
let grid = [];
let selected = null;
let animating = false;
let score = 0;
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('gemcrush_best') || '0'); } catch(e) {}
let level = 1;
let movesLeft = 30;
let levelTarget = 1000;
let comboCount = 0;
let gameActive = false;
let particles = [];
let floatingTexts = [];
let hintTimer = 0;
let hintGems = null;
let hoverCell = null;

// Per-cell animation state
let cells = [];

// --- UI refs ---
const scoreDisplay = document.getElementById('score-display');
const levelDisplay = document.getElementById('level-display');
const movesDisplay = document.getElementById('moves-display');
const bestDisplay = document.getElementById('best-display');
const levelBar = document.getElementById('level-bar');
const levelText = document.getElementById('level-text');
const messageEl = document.getElementById('message');
const comboEl = document.getElementById('combo-display');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const overlayBtn = document.getElementById('overlay-btn');

bestDisplay.textContent = bestScore;

// ============================================================
// Grid Logic
// ============================================================

function randomType() {
  return Math.floor(Math.random() * GEM_TYPES.length);
}

function createGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = randomType();
      } while (
        (c >= 2 && grid[r][c-1] === type && grid[r][c-2] === type) ||
        (r >= 2 && grid[r-1][c] === type && grid[r-2][c] === type)
      );
      grid[r][c] = type;
    }
  }
  initCells();
}

function initCells() {
  cells = [];
  for (let r = 0; r < ROWS; r++) {
    cells[r] = [];
    for (let c = 0; c < COLS; c++) {
      cells[r][c] = {
        type: grid[r][c],
        x: c * CELL + CELL / 2,
        y: r * CELL + CELL / 2,
        targetX: c * CELL + CELL / 2,
        targetY: r * CELL + CELL / 2,
        scale: 1,
        alpha: 1,
      };
    }
  }
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (grid[r][c] !== -1 &&
          grid[r][c] === grid[r][c+1] &&
          grid[r][c] === grid[r][c+2]) {
        let end = c + 2;
        while (end + 1 < COLS && grid[r][end+1] === grid[r][c]) end++;
        for (let i = c; i <= end; i++) matched.add(r * COLS + i);
      }
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (grid[r][c] !== -1 &&
          grid[r][c] === grid[r+1][c] &&
          grid[r][c] === grid[r+2][c]) {
        let end = r + 2;
        while (end + 1 < ROWS && grid[end+1][c] === grid[r][c]) end++;
        for (let i = r; i <= end; i++) matched.add(i * COLS + c);
      }
    }
  }
  return matched;
}

function hasValidMoves() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        swapGrid(r, c, r, c + 1);
        if (findMatches().size > 0) { swapGrid(r, c, r, c + 1); return { r1: r, c1: c, r2: r, c2: c + 1 }; }
        swapGrid(r, c, r, c + 1);
      }
      if (r < ROWS - 1) {
        swapGrid(r, c, r + 1, c);
        if (findMatches().size > 0) { swapGrid(r, c, r + 1, c); return { r1: r, c1: c, r2: r + 1, c2: c }; }
        swapGrid(r, c, r + 1, c);
      }
    }
  }
  return null;
}

function swapGrid(r1, c1, r2, c2) {
  const tmp = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = tmp;
}

// ============================================================
// Particles & Effects
// ============================================================

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.012 + Math.random() * 0.018,
      size: 3 + Math.random() * 5,
      color,
    });
  }
}

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1, vy: -2 });
}

function showMessage(text, duration) {
  messageEl.textContent = text;
  messageEl.style.opacity = '1';
  messageEl.style.transform = 'translate(-50%, -50%) scale(1.1)';
  messageEl.style.color = '#ffd200';
  setTimeout(() => {
    messageEl.style.opacity = '0';
    messageEl.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, duration || 1200);
}

function showCombo(count) {
  if (count < 2) { comboEl.style.opacity = '0'; return; }
  comboEl.textContent = count + 'x Combo!';
  comboEl.style.opacity = '1';
}

// ============================================================
// Drawing
// ============================================================

function drawGem(x, y, typeIdx, scale, alpha, isSelected, isHint) {
  const gem = GEM_TYPES[typeIdx];
  if (!gem) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const s = GEM_SIZE / 2;

  // Glow effect for selected or hinted gems
  if (isSelected) {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
  } else if (isHint) {
    ctx.shadowColor = gem.glow;
    ctx.shadowBlur = 14;
  }

  // Fill + stroke
  ctx.fillStyle = gem.fill;
  ctx.strokeStyle = gem.stroke;
  ctx.lineWidth = 2;
  ctx.beginPath();

  switch (gem.shape) {
    case 'diamond':
      ctx.moveTo(0, -s);
      ctx.lineTo(s, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s, 0);
      ctx.closePath();
      break;
    case 'circle':
      ctx.arc(0, 0, s * 0.82, 0, Math.PI * 2);
      break;
    case 'square': {
      const hs = s * 0.72;
      const rad = 5;
      ctx.moveTo(-hs + rad, -hs);
      ctx.lineTo(hs - rad, -hs);
      ctx.quadraticCurveTo(hs, -hs, hs, -hs + rad);
      ctx.lineTo(hs, hs - rad);
      ctx.quadraticCurveTo(hs, hs, hs - rad, hs);
      ctx.lineTo(-hs + rad, hs);
      ctx.quadraticCurveTo(-hs, hs, -hs, hs - rad);
      ctx.lineTo(-hs, -hs + rad);
      ctx.quadraticCurveTo(-hs, -hs, -hs + rad, -hs);
      ctx.closePath();
      break;
    }
    case 'triangle':
      ctx.moveTo(0, -s * 0.9);
      ctx.lineTo(s * 0.85, s * 0.65);
      ctx.lineTo(-s * 0.85, s * 0.65);
      ctx.closePath();
      break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 6;
        const px = Math.cos(a) * s * 0.82;
        const py = Math.sin(a) * s * 0.82;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      break;
    case 'star':
      for (let i = 0; i < 10; i++) {
        const a = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? s * 0.82 : s * 0.38;
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      break;
  }

  ctx.fill();
  ctx.stroke();

  // Shine highlight
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.globalAlpha = alpha * 0.35;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-s * 0.2, -s * 0.2, s * 0.28, s * 0.2, -0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBoard() {
  ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

  // Background checkerboard
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.1)';
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
  }

  // Hover highlight
  if (hoverCell && !animating && gameActive) {
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(hoverCell.c * CELL, hoverCell.r * CELL, CELL, CELL);
  }

  // Selected cell highlight
  if (selected && gameActive) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.strokeRect(selected.c * CELL + 2, selected.r * CELL + 2, CELL - 4, CELL - 4);
  }

  // Draw gems
  if (cells.length > 0) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cells[r][c];
        if (cell.type < 0 || cell.type >= GEM_TYPES.length) continue;
        if (cell.scale <= 0) continue;
        const isSel = selected && selected.r === r && selected.c === c;
        const isHint = hintGems && (
          (hintGems.r1 === r && hintGems.c1 === c) ||
          (hintGems.r2 === r && hintGems.c2 === c)
        );
        drawGem(cell.x, cell.y, cell.type, cell.scale, cell.alpha, isSel, isHint);
      }
    }
  }

  // Particles
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.life * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating score texts
  for (let i = 0; i < floatingTexts.length; i++) {
    const ft = floatingTexts[i];
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// Game Loop
// ============================================================

let lastTime = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 16.67, 3);
  lastTime = timestamp;

  // Animate cell positions toward targets
  if (cells.length > 0) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cells[r][c];
        const dx = cell.targetX - cell.x;
        const dy = cell.targetY - cell.y;
        if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) {
          cell.x += dx * 0.18 * dt;
          cell.y += dy * 0.18 * dt;
        } else {
          cell.x = cell.targetX;
          cell.y = cell.targetY;
        }
      }
    }
  }

  // Update particles
  particles = particles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.06 * dt;
    p.life -= p.decay * dt;
    return p.life > 0;
  });

  // Update floating texts
  floatingTexts = floatingTexts.filter(ft => {
    ft.y += ft.vy * dt;
    ft.life -= 0.018 * dt;
    return ft.life > 0;
  });

  // Hint timer
  if (gameActive && !animating && selected === null) {
    hintTimer += dt;
    if (hintTimer > 300 && !hintGems) {
      hintGems = hasValidMoves();
    }
  }

  drawBoard();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// Game Mechanics
// ============================================================

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function animateSwap(r1, c1, r2, c2) {
  // Set animation targets to swapped positions
  cells[r1][c1].targetX = c2 * CELL + CELL / 2;
  cells[r1][c1].targetY = r2 * CELL + CELL / 2;
  cells[r2][c2].targetX = c1 * CELL + CELL / 2;
  cells[r2][c2].targetY = r1 * CELL + CELL / 2;

  await sleep(220);

  // Swap cell objects in the array
  const tmp = cells[r1][c1];
  cells[r1][c1] = cells[r2][c2];
  cells[r2][c2] = tmp;

  // Snap targets to correct grid positions
  cells[r1][c1].targetX = c1 * CELL + CELL / 2;
  cells[r1][c1].targetY = r1 * CELL + CELL / 2;
  cells[r2][c2].targetX = c2 * CELL + CELL / 2;
  cells[r2][c2].targetY = r2 * CELL + CELL / 2;
}

async function processMatches() {
  comboCount = 0;
  let matched = findMatches();

  while (matched.size > 0) {
    comboCount++;
    showCombo(comboCount);
    SFX.match(comboCount);

    const matchCount = matched.size;
    const points = matchCount * 10 * comboCount;

    // Spawn particles on matched gems
    for (const idx of matched) {
      const r = Math.floor(idx / COLS);
      const c = idx % COLS;
      const cell = cells[r][c];
      if (cell.type >= 0 && cell.type < GEM_TYPES.length) {
        spawnParticles(cell.x, cell.y, GEM_TYPES[cell.type].glow, 10);
      }
    }

    // Floating score text at center of match
    const indices = [...matched];
    const centerIdx = indices[Math.floor(indices.length / 2)];
    const cr = Math.floor(centerIdx / COLS);
    const cc = centerIdx % COLS;
    spawnFloatingText(cc * CELL + CELL / 2, cr * CELL + CELL / 2, '+' + points, '#ffd200');

    await sleep(180);

    // Remove matched gems
    for (const idx of matched) {
      const r = Math.floor(idx / COLS);
      const c = idx % COLS;
      grid[r][c] = -1;
      cells[r][c].type = -1;
      cells[r][c].scale = 0;
    }

    addScore(points);
    await sleep(200);

    // Gravity: collapse gems down and fill from top
    for (let c = 0; c < COLS; c++) {
      // Collect non-empty gems from bottom to top
      const columnGems = [];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] !== -1) {
          columnGems.push({ type: grid[r][c], prevX: cells[r][c].x, prevY: cells[r][c].y });
        }
      }

      // Count empty spaces to fill
      const emptyCount = ROWS - columnGems.length;

      // Place existing gems at bottom positions
      for (let i = 0; i < columnGems.length; i++) {
        const targetRow = ROWS - 1 - i;
        grid[targetRow][c] = columnGems[i].type;
        cells[targetRow][c].type = columnGems[i].type;
        cells[targetRow][c].x = columnGems[i].prevX;
        cells[targetRow][c].y = columnGems[i].prevY;
        cells[targetRow][c].targetX = c * CELL + CELL / 2;
        cells[targetRow][c].targetY = targetRow * CELL + CELL / 2;
        cells[targetRow][c].scale = 1;
        cells[targetRow][c].alpha = 1;
      }

      // Fill top rows with new gems
      for (let i = 0; i < emptyCount; i++) {
        const r = emptyCount - 1 - i;
        const type = randomType();
        grid[r][c] = type;
        cells[r][c].type = type;
        cells[r][c].x = c * CELL + CELL / 2;
        cells[r][c].y = -(i + 1) * CELL;
        cells[r][c].targetX = c * CELL + CELL / 2;
        cells[r][c].targetY = r * CELL + CELL / 2;
        cells[r][c].scale = 1;
        cells[r][c].alpha = 1;
      }
    }

    SFX.drop();
    await sleep(400);
    matched = findMatches();
  }

  comboEl.style.opacity = '0';

  // Check for valid moves
  if (!hasValidMoves()) {
    showMessage('No moves! Shuffling...', 1200);
    await sleep(1400);
    shuffleBoard();
  }
}

function shuffleBoard() {
  const types = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      types.push(grid[r][c]);

  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }

  let idx = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      grid[r][c] = types[idx++];

  initCells();

  if (!hasValidMoves()) {
    createGrid();
  }
}

function addScore(points) {
  score += points;
  scoreDisplay.textContent = score;

  const progress = Math.min(score / levelTarget * 100, 100);
  levelBar.style.width = progress + '%';

  if (score >= levelTarget) {
    levelUp();
  }

  if (score > bestScore) {
    bestScore = score;
    bestDisplay.textContent = bestScore;
    try { localStorage.setItem('gemcrush_best', String(bestScore)); } catch(e) {}
  }
}

function levelUp() {
  level++;
  movesLeft += 5;
  levelTarget = level * 1000;
  levelDisplay.textContent = level;
  movesDisplay.textContent = movesLeft;
  levelText.textContent = 'Score ' + levelTarget + ' to reach Level ' + (level + 1);
  showMessage('Level ' + level + '!', 1500);
  SFX.levelUp();
}

// ============================================================
// Input Handling
// ============================================================

function getCellFromPointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  const c = Math.floor(x / CELL);
  const r = Math.floor(y / CELL);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
  return null;
}

// --- Mouse ---
let dragStart = null;

canvas.addEventListener('mousemove', function(e) {
  hoverCell = getCellFromPointer(e.clientX, e.clientY);
});

canvas.addEventListener('mouseleave', function() {
  hoverCell = null;
});

canvas.addEventListener('mousedown', function(e) {
  if (animating || !gameActive) return;
  dragStart = getCellFromPointer(e.clientX, e.clientY);
});

canvas.addEventListener('mouseup', function(e) {
  if (animating || !gameActive || !dragStart) return;
  const cell = getCellFromPointer(e.clientX, e.clientY);
  if (!cell) { dragStart = null; return; }

  const dr = cell.r - dragStart.r;
  const dc = cell.c - dragStart.c;

  if (Math.abs(dr) + Math.abs(dc) === 1) {
    trySwap(dragStart.r, dragStart.c, cell.r, cell.c);
  } else {
    handleClick(dragStart);
  }
  dragStart = null;
});

// --- Touch ---
let touchStart = null;
let touchStartPos = null;

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (animating || !gameActive) return;
  const t = e.touches[0];
  touchStart = getCellFromPointer(t.clientX, t.clientY);
  touchStartPos = { x: t.clientX, y: t.clientY };
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!touchStart || !touchStartPos || animating || !gameActive) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartPos.x;
  const dy = t.clientY - touchStartPos.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  // If finger moved far enough, determine swipe direction
  if (dist > 20) {
    let sr = 0, sc = 0;
    if (Math.abs(dx) > Math.abs(dy)) {
      sc = dx > 0 ? 1 : -1;
    } else {
      sr = dy > 0 ? 1 : -1;
    }
    const tr = touchStart.r + sr;
    const tc = touchStart.c + sc;
    if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
      trySwap(touchStart.r, touchStart.c, tr, tc);
    }
    touchStart = null;
    touchStartPos = null;
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (!touchStart || animating || !gameActive) { touchStart = null; touchStartPos = null; return; }
  // If we didn't swipe, treat as tap
  handleClick(touchStart);
  touchStart = null;
  touchStartPos = null;
}, { passive: false });

function handleClick(cell) {
  if (!selected) {
    selected = cell;
    SFX.select();
    hintGems = null;
    hintTimer = 0;
    return;
  }

  const dr = Math.abs(cell.r - selected.r);
  const dc = Math.abs(cell.c - selected.c);

  if (dr + dc === 1) {
    trySwap(selected.r, selected.c, cell.r, cell.c);
  } else {
    selected = cell;
    SFX.select();
    hintGems = null;
    hintTimer = 0;
  }
}

async function trySwap(r1, c1, r2, c2) {
  animating = true;
  selected = null;
  hintGems = null;
  hintTimer = 0;

  SFX.swap();
  swapGrid(r1, c1, r2, c2);
  await animateSwap(r1, c1, r2, c2);

  const matched = findMatches();
  if (matched.size === 0) {
    // Invalid swap - reverse
    SFX.badSwap();
    swapGrid(r1, c1, r2, c2);
    await animateSwap(r1, c1, r2, c2);
    animating = false;
    return;
  }

  movesLeft--;
  movesDisplay.textContent = movesLeft;

  await processMatches();
  animating = false;

  if (movesLeft <= 0) {
    gameOver();
  }
}

// ============================================================
// Game Flow
// ============================================================

function startGame() {
  score = 0;
  level = 1;
  movesLeft = 30;
  levelTarget = 1000;
  comboCount = 0;
  selected = null;
  hintGems = null;
  hintTimer = 0;
  animating = false;
  particles = [];
  floatingTexts = [];

  scoreDisplay.textContent = '0';
  levelDisplay.textContent = '1';
  movesDisplay.textContent = '30';
  levelBar.style.width = '0%';
  levelText.textContent = 'Score 1000 to reach Level 2';

  createGrid();
  overlay.classList.add('hidden');
  gameActive = true;
}

function gameOver() {
  gameActive = false;
  SFX.gameOver();
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = 'Final Score: ' + score + ' | Level: ' + level;
  overlayBtn.textContent = 'Play Again';
  setTimeout(function() { overlay.classList.remove('hidden'); }, 800);
}

overlayBtn.addEventListener('click', function() {
  ensureAudio();
  SFX.buttonClick();
  startGame();
});

// Start render loop
requestAnimationFrame(gameLoop);
</script>
