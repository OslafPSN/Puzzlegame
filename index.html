<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Crush - Match 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
  overflow: hidden;
}

#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

#header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 480px;
  padding: 0 8px;
}

#header h1 {
  font-size: 28px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}

.stat-box {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 6px 16px;
  text-align: center;
  min-width: 90px;
}

.stat-box .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.7;
}

.stat-box .value {
  font-size: 22px;
  font-weight: bold;
}

#stats-row {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 480px;
  justify-content: center;
}

#board-wrapper {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(100, 60, 255, 0.3), inset 0 0 60px rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.15);
}

canvas {
  display: block;
  cursor: pointer;
}

#level-bar-container {
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  height: 20px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
}

#level-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  border-radius: 10px;
  transition: width 0.4s ease;
}

#level-text {
  font-size: 12px;
  opacity: 0.7;
  text-align: center;
}

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0;
  text-shadow: 0 0 20px rgba(255,200,0,0.8);
  z-index: 10;
  white-space: nowrap;
}

#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  z-index: 20;
  border-radius: 16px;
}

#overlay.hidden { display: none; }

#overlay h2 {
  font-size: 32px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#overlay button {
  padding: 12px 36px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s;
}

#overlay button:hover {
  transform: scale(1.05);
}

#combo-display {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 18px;
  font-weight: bold;
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  color: #ffd200;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <h1>Gem Crush</h1>
    <div class="stat-box">
      <div class="label">Score</div>
      <div class="value" id="score-display">0</div>
    </div>
  </div>
  <div id="stats-row">
    <div class="stat-box">
      <div class="label">Level</div>
      <div class="value" id="level-display">1</div>
    </div>
    <div class="stat-box">
      <div class="label">Moves</div>
      <div class="value" id="moves-display">30</div>
    </div>
    <div class="stat-box">
      <div class="label">Best</div>
      <div class="value" id="best-display">0</div>
    </div>
  </div>
  <div id="level-text">Score 1000 to reach Level 2</div>
  <div id="level-bar-container">
    <div id="level-bar"></div>
  </div>
  <div id="board-wrapper">
    <canvas id="board"></canvas>
    <div id="message"></div>
    <div id="combo-display"></div>
    <div id="overlay">
      <h2 id="overlay-title">Gem Crush</h2>
      <p id="overlay-text">Swap gems to match 3 or more!</p>
      <button id="overlay-btn">Play</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// GEM CRUSH - Match 3 Game
// ============================================================

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// --- Constants ---
const COLS = 8;
const ROWS = 8;
const CELL = 56;
const PAD = 4;
const GEM_SIZE = CELL - PAD * 2;
const BOARD_W = COLS * CELL;
const BOARD_H = ROWS * CELL;

canvas.width = BOARD_W;
canvas.height = BOARD_H;

// Gem types with colors and shapes
const GEM_TYPES = [
  { name: 'ruby',     color: '#e74c3c', glow: '#ff6b6b', shape: 'diamond' },
  { name: 'emerald',  color: '#2ecc71', glow: '#69ff9b', shape: 'circle'  },
  { name: 'sapphire', color: '#3498db', glow: '#6bc1ff', shape: 'square'  },
  { name: 'topaz',    color: '#f39c12', glow: '#ffbe45', shape: 'triangle'},
  { name: 'amethyst', color: '#9b59b6', glow: '#c98bde', shape: 'hexagon' },
  { name: 'pearl',    color: '#ecf0f1', glow: '#ffffff', shape: 'star'    },
];

// --- Game State ---
let grid = [];
let selected = null;
let animating = false;
let score = 0;
let bestScore = parseInt(localStorage.getItem('gemcrush_best') || '0');
let level = 1;
let movesLeft = 30;
let levelTarget = 1000;
let comboCount = 0;
let gameActive = false;
let particles = [];
let floatingTexts = [];
let hintTimer = 0;
let hintGems = null;
let hoverCell = null;

// Animation state per cell
// Each cell: { type, x, y, targetX, targetY, scale, alpha, angle }
let cells = [];

// --- UI refs ---
const scoreDisplay = document.getElementById('score-display');
const levelDisplay = document.getElementById('level-display');
const movesDisplay = document.getElementById('moves-display');
const bestDisplay = document.getElementById('best-display');
const levelBar = document.getElementById('level-bar');
const levelText = document.getElementById('level-text');
const messageEl = document.getElementById('message');
const comboEl = document.getElementById('combo-display');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const overlayBtn = document.getElementById('overlay-btn');

bestDisplay.textContent = bestScore;

// ============================================================
// Grid Logic
// ============================================================

function randomType() {
  return Math.floor(Math.random() * GEM_TYPES.length);
}

function createGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = randomType();
      } while (
        (c >= 2 && grid[r][c-1] === type && grid[r][c-2] === type) ||
        (r >= 2 && grid[r-1][c] === type && grid[r-2][c] === type)
      );
      grid[r][c] = type;
    }
  }
  syncCells(false);
}

function syncCells(animate) {
  cells = [];
  for (let r = 0; r < ROWS; r++) {
    cells[r] = [];
    for (let c = 0; c < COLS; c++) {
      cells[r][c] = {
        type: grid[r][c],
        x: c * CELL + CELL / 2,
        y: animate ? -CELL * (ROWS - r) : r * CELL + CELL / 2,
        targetX: c * CELL + CELL / 2,
        targetY: r * CELL + CELL / 2,
        scale: 1,
        alpha: 1,
        angle: 0,
      };
    }
  }
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (grid[r][c] !== -1 &&
          grid[r][c] === grid[r][c+1] &&
          grid[r][c] === grid[r][c+2]) {
        let end = c + 2;
        while (end + 1 < COLS && grid[r][end+1] === grid[r][c]) end++;
        for (let i = c; i <= end; i++) matched.add(r * COLS + i);
      }
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (grid[r][c] !== -1 &&
          grid[r][c] === grid[r+1][c] &&
          grid[r][c] === grid[r+2][c]) {
        let end = r + 2;
        while (end + 1 < ROWS && grid[end+1][c] === grid[r][c]) end++;
        for (let i = r; i <= end; i++) matched.add(i * COLS + c);
      }
    }
  }
  return matched;
}

function hasValidMoves() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // Try swap right
      if (c < COLS - 1) {
        swap(r, c, r, c + 1);
        if (findMatches().size > 0) { swap(r, c, r, c + 1); return { r1: r, c1: c, r2: r, c2: c + 1 }; }
        swap(r, c, r, c + 1);
      }
      // Try swap down
      if (r < ROWS - 1) {
        swap(r, c, r + 1, c);
        if (findMatches().size > 0) { swap(r, c, r + 1, c); return { r1: r, c1: c, r2: r + 1, c2: c }; }
        swap(r, c, r + 1, c);
      }
    }
  }
  return null;
}

function swap(r1, c1, r2, c2) {
  const tmp = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = tmp;
}

// ============================================================
// Animations & Particles
// ============================================================

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color,
    });
  }
}

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

function showMessage(text, duration) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  messageEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
  messageEl.style.color = '#ffd200';
  setTimeout(() => {
    messageEl.style.opacity = 0;
    messageEl.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, duration || 1200);
}

function showCombo(count) {
  if (count < 2) { comboEl.style.opacity = 0; return; }
  comboEl.textContent = `${count}x Combo!`;
  comboEl.style.opacity = 1;
  comboEl.style.transform = 'scale(1.3)';
  setTimeout(() => { comboEl.style.transform = 'scale(1)'; }, 150);
}

// ============================================================
// Drawing
// ============================================================

function drawGem(x, y, type, scale, alpha, isSelected, isHint) {
  const gem = GEM_TYPES[type];
  if (!gem) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const s = GEM_SIZE / 2;

  // Glow for selected/hint
  if (isSelected || isHint) {
    ctx.shadowColor = isSelected ? '#fff' : gem.glow;
    ctx.shadowBlur = isSelected ? 18 : 12;
  }

  // Draw shape
  ctx.fillStyle = gem.color;
  ctx.strokeStyle = gem.glow;
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  switch (gem.shape) {
    case 'diamond':
      ctx.moveTo(0, -s);
      ctx.lineTo(s, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s, 0);
      ctx.closePath();
      break;
    case 'circle':
      ctx.arc(0, 0, s * 0.85, 0, Math.PI * 2);
      break;
    case 'square':
      roundRect(-s * 0.75, -s * 0.75, s * 1.5, s * 1.5, 6);
      break;
    case 'triangle':
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.9, s * 0.7);
      ctx.lineTo(-s * 0.9, s * 0.7);
      ctx.closePath();
      break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 6;
        const px = Math.cos(a) * s * 0.85;
        const py = Math.sin(a) * s * 0.85;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      break;
    case 'star':
      for (let i = 0; i < 10; i++) {
        const a = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? s * 0.85 : s * 0.4;
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      break;
  }
  ctx.fill();
  ctx.stroke();

  // Highlight shine
  ctx.globalAlpha = alpha * 0.3;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-s * 0.25, -s * 0.25, s * 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBoard() {
  // Background grid
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL;
      const y = r * CELL;
      ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.08)';
      ctx.fillRect(x, y, CELL, CELL);
    }
  }

  // Hover highlight
  if (hoverCell && !animating && gameActive) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(hoverCell.c * CELL, hoverCell.r * CELL, CELL, CELL);
  }

  // Gems
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = cells[r][c];
      if (cell.type === -1) continue;
      const isSel = selected && selected.r === r && selected.c === c;
      const isHint = hintGems && ((hintGems.r1 === r && hintGems.c1 === c) || (hintGems.r2 === r && hintGems.c2 === c));
      drawGem(cell.x, cell.y, cell.type, cell.scale, cell.alpha, isSel, isHint);
    }
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Floating texts
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 20px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;
}

// ============================================================
// Game Loop & Animation
// ============================================================

let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 16.67, 3); // normalize to ~60fps
  lastTime = timestamp;

  // Update cell positions
  let moving = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = cells[r][c];
      const dx = cell.targetX - cell.x;
      const dy = cell.targetY - cell.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        cell.x += dx * 0.2 * dt;
        cell.y += dy * 0.2 * dt;
        moving = true;
      } else {
        cell.x = cell.targetX;
        cell.y = cell.targetY;
      }
    }
  }

  // Update particles
  particles = particles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.05 * dt;
    p.life -= p.decay * dt;
    return p.life > 0;
  });

  // Update floating texts
  floatingTexts = floatingTexts.filter(ft => {
    ft.y += ft.vy * dt;
    ft.life -= 0.02 * dt;
    return ft.life > 0;
  });

  // Hint timer
  if (gameActive && !animating && selected === null) {
    hintTimer += dt;
    if (hintTimer > 300) { // ~5 seconds
      if (!hintGems) {
        hintGems = hasValidMoves();
      }
    }
  }

  ctx.clearRect(0, 0, BOARD_W, BOARD_H);
  drawBoard();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// Game Mechanics
// ============================================================

async function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function animateSwap(r1, c1, r2, c2) {
  cells[r1][c1].targetX = c2 * CELL + CELL / 2;
  cells[r1][c1].targetY = r2 * CELL + CELL / 2;
  cells[r2][c2].targetX = c1 * CELL + CELL / 2;
  cells[r2][c2].targetY = r1 * CELL + CELL / 2;
  await sleep(200);
  // Swap cell objects
  const tmp = cells[r1][c1];
  cells[r1][c1] = cells[r2][c2];
  cells[r2][c2] = tmp;
  // Fix targets
  cells[r1][c1].targetX = c1 * CELL + CELL / 2;
  cells[r1][c1].targetY = r1 * CELL + CELL / 2;
  cells[r2][c2].targetX = c2 * CELL + CELL / 2;
  cells[r2][c2].targetY = r2 * CELL + CELL / 2;
}

async function processMatches() {
  comboCount = 0;
  let matched = findMatches();

  while (matched.size > 0) {
    comboCount++;
    showCombo(comboCount);

    const matchCount = matched.size;
    const basePoints = matchCount * 10;
    const comboMultiplier = comboCount;
    const points = basePoints * comboMultiplier;

    // Animate matched gems
    for (const idx of matched) {
      const r = Math.floor(idx / COLS);
      const c = idx % COLS;
      const cell = cells[r][c];
      const gem = GEM_TYPES[cell.type];
      spawnParticles(cell.x, cell.y, gem.glow, 8);
    }

    // Score text at center of match
    const indices = [...matched];
    const centerIdx = indices[Math.floor(indices.length / 2)];
    const cr = Math.floor(centerIdx / COLS);
    const cc = centerIdx % COLS;
    spawnFloatingText(cc * CELL + CELL / 2, cr * CELL + CELL / 2, `+${points}`, '#ffd200');

    await sleep(150);

    // Remove matched
    for (const idx of matched) {
      const r = Math.floor(idx / COLS);
      const c = idx % COLS;
      grid[r][c] = -1;
      cells[r][c].type = -1;
      cells[r][c].scale = 0;
    }

    addScore(points);
    await sleep(200);

    // Gravity: drop gems down
    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] !== -1) {
          if (writeRow !== r) {
            grid[writeRow][c] = grid[r][c];
            grid[r][c] = -1;
            cells[writeRow][c].type = cells[r][c].type;
            cells[writeRow][c].x = cells[r][c].x;
            cells[writeRow][c].y = cells[r][c].y;
            cells[writeRow][c].scale = 1;
            cells[writeRow][c].alpha = 1;
            cells[writeRow][c].targetX = c * CELL + CELL / 2;
            cells[writeRow][c].targetY = writeRow * CELL + CELL / 2;
            cells[r][c].type = -1;
          }
          writeRow--;
        }
      }
      // Fill from top
      for (let r = writeRow; r >= 0; r--) {
        const type = randomType();
        grid[r][c] = type;
        cells[r][c].type = type;
        cells[r][c].x = c * CELL + CELL / 2;
        cells[r][c].y = -(writeRow - r + 1) * CELL;
        cells[r][c].targetX = c * CELL + CELL / 2;
        cells[r][c].targetY = r * CELL + CELL / 2;
        cells[r][c].scale = 1;
        cells[r][c].alpha = 1;
      }
    }

    await sleep(350);
    matched = findMatches();
  }

  comboEl.style.opacity = 0;

  // Check for valid moves
  if (!hasValidMoves()) {
    showMessage('No moves! Shuffling...', 1200);
    await sleep(1300);
    shuffleBoard();
  }
}

function shuffleBoard() {
  // Flatten, shuffle, replace
  const types = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      types.push(grid[r][c]);

  // Fisher-Yates shuffle
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }

  let idx = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      grid[r][c] = types[idx++];

  syncCells(true);

  // If still no valid moves, recreate
  if (!hasValidMoves()) {
    createGrid();
  }
}

function addScore(points) {
  score += points;
  scoreDisplay.textContent = score;

  // Level progress
  const progress = Math.min(score / levelTarget * 100, 100);
  levelBar.style.width = progress + '%';

  if (score >= levelTarget) {
    levelUp();
  }

  if (score > bestScore) {
    bestScore = score;
    bestDisplay.textContent = bestScore;
    localStorage.setItem('gemcrush_best', bestScore.toString());
  }
}

function levelUp() {
  level++;
  movesLeft += 5;
  levelTarget = level * 1000;
  levelDisplay.textContent = level;
  movesDisplay.textContent = movesLeft;
  levelText.textContent = `Score ${levelTarget} to reach Level ${level + 1}`;
  showMessage(`Level ${level}!`, 1500);
}

// ============================================================
// Input Handling
// ============================================================

function getCellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const c = Math.floor(x / CELL);
  const r = Math.floor(y / CELL);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
  return null;
}

canvas.addEventListener('mousemove', e => {
  hoverCell = getCellFromEvent(e);
});

canvas.addEventListener('mouseleave', () => {
  hoverCell = null;
});

// Touch / drag support
let dragStart = null;

canvas.addEventListener('mousedown', e => {
  if (animating || !gameActive) return;
  const cell = getCellFromEvent(e);
  if (!cell) return;
  dragStart = cell;
});

canvas.addEventListener('mouseup', async e => {
  if (animating || !gameActive) return;
  const cell = getCellFromEvent(e);
  if (!cell || !dragStart) return;

  const dr = cell.r - dragStart.r;
  const dc = cell.c - dragStart.c;

  // If dragged to adjacent cell
  if (Math.abs(dr) + Math.abs(dc) === 1) {
    await trySwap(dragStart.r, dragStart.c, cell.r, cell.c);
    dragStart = null;
    return;
  }

  // Click-based selection
  handleClick(dragStart);
  dragStart = null;
});

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (animating || !gameActive) return;
  const touch = e.touches[0];
  const cell = getCellFromEvent(touch);
  if (cell) dragStart = cell;
});

canvas.addEventListener('touchend', async e => {
  e.preventDefault();
  if (animating || !gameActive || !dragStart) return;
  const touch = e.changedTouches[0];
  const cell = getCellFromEvent(touch);
  if (!cell) { dragStart = null; return; }

  const dr = cell.r - dragStart.r;
  const dc = cell.c - dragStart.c;

  if (Math.abs(dr) + Math.abs(dc) === 1) {
    await trySwap(dragStart.r, dragStart.c, cell.r, cell.c);
  } else {
    handleClick(dragStart);
  }
  dragStart = null;
});

async function handleClick(cell) {
  if (!selected) {
    selected = cell;
    hintGems = null;
    hintTimer = 0;
    return;
  }

  const dr = Math.abs(cell.r - selected.r);
  const dc = Math.abs(cell.c - selected.c);

  if (dr + dc === 1) {
    await trySwap(selected.r, selected.c, cell.r, cell.c);
  } else {
    selected = cell;
    hintGems = null;
    hintTimer = 0;
  }
}

async function trySwap(r1, c1, r2, c2) {
  animating = true;
  selected = null;
  hintGems = null;
  hintTimer = 0;

  // Perform swap
  swap(r1, c1, r2, c2);
  await animateSwap(r1, c1, r2, c2);

  const matched = findMatches();
  if (matched.size === 0) {
    // Invalid swap - swap back
    swap(r1, c1, r2, c2);
    await animateSwap(r1, c1, r2, c2);
    animating = false;
    return;
  }

  // Valid move
  movesLeft--;
  movesDisplay.textContent = movesLeft;

  await processMatches();
  animating = false;

  // Check game over
  if (movesLeft <= 0) {
    gameOver();
  }
}

// ============================================================
// Game State Management
// ============================================================

function startGame() {
  score = 0;
  level = 1;
  movesLeft = 30;
  levelTarget = 1000;
  comboCount = 0;
  selected = null;
  hintGems = null;
  hintTimer = 0;
  animating = false;
  particles = [];
  floatingTexts = [];

  scoreDisplay.textContent = '0';
  levelDisplay.textContent = '1';
  movesDisplay.textContent = '30';
  levelBar.style.width = '0%';
  levelText.textContent = 'Score 1000 to reach Level 2';

  createGrid();
  overlay.classList.add('hidden');
  gameActive = true;

  // Remove initial matches
  (async () => {
    await sleep(500);
    animating = true;
    await processMatches();
    animating = false;
  })();
}

function gameOver() {
  gameActive = false;
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = `Final Score: ${score} | Level: ${level}`;
  overlayBtn.textContent = 'Play Again';
  setTimeout(() => overlay.classList.remove('hidden'), 800);
}

overlayBtn.addEventListener('click', startGame);

// Start render loop
requestAnimationFrame(gameLoop);
</script>
