<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gem Crush - Match 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 500px;
  padding: 8px 12px;
}

#header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

#header h1 {
  font-size: clamp(20px, 6vw, 28px);
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-box {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 4px 10px;
  text-align: center;
  min-width: 70px;
}

.stat-box .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.7;
}

.stat-box .value {
  font-size: clamp(16px, 5vw, 22px);
  font-weight: bold;
}

#stats-row {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
}

#board-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(100, 60, 255, 0.3);
  border: 2px solid rgba(255,255,255,0.15);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

#level-bar-container {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  height: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
}

#level-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  border-radius: 8px;
  transition: width 0.4s ease;
}

#level-text {
  font-size: 11px;
  opacity: 0.7;
  text-align: center;
}

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(24px, 7vw, 36px);
  font-weight: bold;
  pointer-events: none;
  opacity: 0;
  text-shadow: 0 0 20px rgba(255,200,0,0.8);
  z-index: 10;
  white-space: nowrap;
  transition: opacity 0.3s, transform 0.3s;
}

#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 20;
  border-radius: 12px;
}

#overlay.hidden { display: none; }

#overlay h2 {
  font-size: clamp(24px, 8vw, 36px);
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#overlay p {
  font-size: clamp(14px, 4vw, 18px);
  opacity: 0.8;
}

#overlay button {
  padding: 12px 40px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  color: #1a1a2e;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s;
}

#overlay button:hover {
  transform: scale(1.05);
}

#combo-display {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: clamp(14px, 4vw, 20px);
  font-weight: bold;
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  color: #ffd200;
  transition: opacity 0.2s;
}

#sound-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 20px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
  line-height: 1;
}

#sound-toggle:hover {
  background: rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <h1>Gem Crush</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="sound-toggle" title="Toggle sound">&#x1f50a;</button>
      <div class="stat-box">
        <div class="label">Score</div>
        <div class="value" id="score-display">0</div>
      </div>
    </div>
  </div>
  <div id="stats-row">
    <div class="stat-box">
      <div class="label">Level</div>
      <div class="value" id="level-display">1</div>
    </div>
    <div class="stat-box">
      <div class="label">Moves</div>
      <div class="value" id="moves-display">30</div>
    </div>
    <div class="stat-box">
      <div class="label">Best</div>
      <div class="value" id="best-display">0</div>
    </div>
  </div>
  <div id="level-text">Score 1000 to reach Level 2</div>
  <div id="level-bar-container">
    <div id="level-bar"></div>
  </div>
  <div id="board-wrapper">
    <canvas id="board"></canvas>
    <div id="message"></div>
    <div id="combo-display"></div>
    <div id="overlay">
      <h2 id="overlay-title">Gem Crush</h2>
      <p id="overlay-text">Swap gems to match 3 or more!</p>
      <button id="overlay-btn">Play</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// GEM CRUSH - Match 3 Game (with Special Gems)
// ============================================================

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// ============================================================
// Sound Engine (Web Audio API)
// ============================================================

let audioCtx = null;
let soundEnabled = true;
const soundToggleBtn = document.getElementById('sound-toggle');

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, volume) {
  if (!soundEnabled || !audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playNoise(duration, volume) {
  if (!soundEnabled || !audioCtx) return;
  try {
    var len = audioCtx.sampleRate * duration;
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume || 0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    var filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = 3000; filt.Q.value = 0.5;
    src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  } catch(e) {}
}

var SFX = {
  select: function() { playTone(880, 0.08, 'sine', 0.1); },
  swap: function() {
    playTone(440, 0.06, 'sine', 0.1);
    setTimeout(function() { playTone(554, 0.06, 'sine', 0.1); }, 50);
  },
  badSwap: function() {
    playTone(200, 0.15, 'square', 0.08);
    setTimeout(function() { playTone(160, 0.2, 'square', 0.08); }, 80);
  },
  match: function(combo) {
    var base = 523 + (combo - 1) * 80;
    playTone(base, 0.12, 'sine', 0.13);
    setTimeout(function() { playTone(base * 1.25, 0.12, 'sine', 0.13); }, 60);
    setTimeout(function() { playTone(base * 1.5, 0.15, 'sine', 0.10); }, 120);
    playNoise(0.1, 0.04);
  },
  drop: function() { playTone(180, 0.15, 'sine', 0.06); },
  special: function() {
    playTone(784, 0.1, 'sine', 0.15);
    setTimeout(function() { playTone(988, 0.1, 'sine', 0.15); }, 50);
    setTimeout(function() { playTone(1318, 0.15, 'sine', 0.12); }, 100);
    playNoise(0.2, 0.08);
  },
  levelUp: function() {
    [523, 659, 784, 1047].forEach(function(n, i) {
      setTimeout(function() { playTone(n, 0.2, 'sine', 0.12); }, i * 100);
    });
  },
  gameOver: function() {
    [440, 370, 311, 262].forEach(function(n, i) {
      setTimeout(function() { playTone(n, 0.3, 'triangle', 0.12); }, i * 150);
    });
  },
  buttonClick: function() {
    playTone(660, 0.06, 'sine', 0.1);
    setTimeout(function() { playTone(880, 0.08, 'sine', 0.1); }, 40);
  },
};

soundToggleBtn.addEventListener('click', function() {
  ensureAudio();
  soundEnabled = !soundEnabled;
  soundToggleBtn.innerHTML = soundEnabled ? '&#x1f50a;' : '&#x1f507;';
});

// --- Board dimensions ---
var COLS = 8, ROWS = 8;
var CELL = 64, PAD = 5;
var GEM_SIZE = CELL - PAD * 2;
var BOARD_PX = COLS * CELL;

canvas.width = BOARD_PX;
canvas.height = BOARD_PX;

// Gem types
var GEM_TYPES = [
  { name: 'ruby',     fill: '#e74c3c', stroke: '#ff8a80', glow: '#ff6b6b', shape: 'diamond'  },
  { name: 'emerald',  fill: '#2ecc71', stroke: '#81ffa8', glow: '#69ff9b', shape: 'circle'   },
  { name: 'sapphire', fill: '#3498db', stroke: '#90caf9', glow: '#6bc1ff', shape: 'square'   },
  { name: 'topaz',    fill: '#f39c12', stroke: '#ffd54f', glow: '#ffbe45', shape: 'triangle' },
  { name: 'amethyst', fill: '#9b59b6', stroke: '#ce93d8', glow: '#c98bde', shape: 'hexagon'  },
  { name: 'pearl',    fill: '#dfe6e9', stroke: '#ffffff', glow: '#ffffff', shape: 'star'     },
];

// --- Game State ---
var grid = [];       // 2D array of gem type indices (-1 = empty)
var specials = [];   // 2D array: null, 'row', 'col', or 'bomb'
var cells = [];      // 2D array of animation state per cell
var selected = null;
var animating = false;
var score = 0;
var bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('gemcrush_best') || '0'); } catch(e) {}
var level = 1;
var movesLeft = 30;
var levelTarget = 1000;
var comboCount = 0;
var gameActive = false;
var particles = [];
var floatingTexts = [];
var hintTimer = 0;
var hintGems = null;
var hoverCell = null;

// --- UI refs ---
var scoreDisplay = document.getElementById('score-display');
var levelDisplay = document.getElementById('level-display');
var movesDisplay = document.getElementById('moves-display');
var bestDisplay = document.getElementById('best-display');
var levelBar = document.getElementById('level-bar');
var levelText = document.getElementById('level-text');
var messageEl = document.getElementById('message');
var comboEl = document.getElementById('combo-display');
var overlay = document.getElementById('overlay');
var overlayTitle = document.getElementById('overlay-title');
var overlayText = document.getElementById('overlay-text');
var overlayBtn = document.getElementById('overlay-btn');

bestDisplay.textContent = bestScore;

// ============================================================
// Grid Logic
// ============================================================

function randomType() {
  return Math.floor(Math.random() * GEM_TYPES.length);
}

function createGrid() {
  grid = []; specials = [];
  for (var r = 0; r < ROWS; r++) {
    grid[r] = []; specials[r] = [];
    for (var c = 0; c < COLS; c++) {
      var type;
      do {
        type = randomType();
      } while (
        (c >= 2 && grid[r][c-1] === type && grid[r][c-2] === type) ||
        (r >= 2 && grid[r-1][c] === type && grid[r-2][c] === type)
      );
      grid[r][c] = type;
      specials[r][c] = null;
    }
  }
  initCells();
}

function initCells() {
  cells = [];
  for (var r = 0; r < ROWS; r++) {
    cells[r] = [];
    for (var c = 0; c < COLS; c++) {
      cells[r][c] = {
        type: grid[r][c],
        x: c * CELL + CELL / 2,
        y: r * CELL + CELL / 2,
        targetX: c * CELL + CELL / 2,
        targetY: r * CELL + CELL / 2,
        scale: 1, alpha: 1,
      };
    }
  }
}

// Return match groups with direction and length info
function findMatchGroups() {
  var groups = [];
  // Horizontal
  for (var r = 0; r < ROWS; r++) {
    var c = 0;
    while (c < COLS) {
      if (grid[r][c] === -1) { c++; continue; }
      var end = c;
      while (end + 1 < COLS && grid[r][end + 1] === grid[r][c]) end++;
      if (end - c >= 2) {
        var pos = [];
        for (var i = c; i <= end; i++) pos.push(r * COLS + i);
        groups.push({ dir: 'h', len: end - c + 1, cells: pos, type: grid[r][c] });
      }
      c = end + 1;
    }
  }
  // Vertical
  for (var c2 = 0; c2 < COLS; c2++) {
    var r2 = 0;
    while (r2 < ROWS) {
      if (grid[r2][c2] === -1) { r2++; continue; }
      var end2 = r2;
      while (end2 + 1 < ROWS && grid[end2 + 1][c2] === grid[r2][c2]) end2++;
      if (end2 - r2 >= 2) {
        var pos2 = [];
        for (var j = r2; j <= end2; j++) pos2.push(j * COLS + c2);
        groups.push({ dir: 'v', len: end2 - r2 + 1, cells: pos2, type: grid[r2][c2] });
      }
      r2 = end2 + 1;
    }
  }
  return groups;
}

// Flat set of all matched cell indices (for hasValidMoves compatibility)
function findMatches() {
  var groups = findMatchGroups();
  var matched = new Set();
  for (var g = 0; g < groups.length; g++) {
    for (var i = 0; i < groups[g].cells.length; i++) matched.add(groups[g].cells[i]);
  }
  return matched;
}

// Get cells affected by a special gem triggering
function getSpecialEffect(r, c, type) {
  var affected = [];
  if (type === 'row') {
    for (var cc = 0; cc < COLS; cc++) affected.push(r * COLS + cc);
  } else if (type === 'col') {
    for (var rr = 0; rr < ROWS; rr++) affected.push(rr * COLS + c);
  } else if (type === 'bomb') {
    for (var dr = -2; dr <= 2; dr++) {
      for (var dc = -2; dc <= 2; dc++) {
        var nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) affected.push(nr * COLS + nc);
      }
    }
  }
  return affected;
}

function hasValidMoves() {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        swapGrid(r, c, r, c + 1);
        if (findMatches().size > 0) { swapGrid(r, c, r, c + 1); return { r1: r, c1: c, r2: r, c2: c + 1 }; }
        swapGrid(r, c, r, c + 1);
      }
      if (r < ROWS - 1) {
        swapGrid(r, c, r + 1, c);
        if (findMatches().size > 0) { swapGrid(r, c, r + 1, c); return { r1: r, c1: c, r2: r + 1, c2: c }; }
        swapGrid(r, c, r + 1, c);
      }
    }
  }
  return null;
}

function swapGrid(r1, c1, r2, c2) {
  var tmp = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = tmp;
  var ts = specials[r1][c1]; specials[r1][c1] = specials[r2][c2]; specials[r2][c2] = ts;
}

// ============================================================
// Particles & Effects
// ============================================================

function spawnParticles(x, y, color, count) {
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 1.5 + Math.random() * 4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.012 + Math.random() * 0.018,
      size: 3 + Math.random() * 5, color: color,
    });
  }
}

function spawnLineParticles(r, c, type) {
  var cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
  if (type === 'row') {
    for (var cc = 0; cc < COLS; cc++)
      spawnParticles(cc * CELL + CELL / 2, cy, '#fff', 3);
  } else if (type === 'col') {
    for (var rr = 0; rr < ROWS; rr++)
      spawnParticles(cx, rr * CELL + CELL / 2, '#fff', 3);
  } else if (type === 'bomb') {
    for (var dr = -2; dr <= 2; dr++)
      for (var dc = -2; dc <= 2; dc++) {
        var nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS)
          spawnParticles(nc * CELL + CELL / 2, nr * CELL + CELL / 2, '#ffd200', 4);
      }
  }
}

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1, vy: -2 });
}

function showMessage(text, duration) {
  messageEl.textContent = text;
  messageEl.style.opacity = '1';
  messageEl.style.transform = 'translate(-50%, -50%) scale(1.1)';
  messageEl.style.color = '#ffd200';
  setTimeout(function() {
    messageEl.style.opacity = '0';
    messageEl.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, duration || 1200);
}

function showCombo(count) {
  if (count < 2) { comboEl.style.opacity = '0'; return; }
  comboEl.textContent = count + 'x Combo!';
  comboEl.style.opacity = '1';
}

// ============================================================
// Drawing
// ============================================================

function drawGemShape(s, shape) {
  switch (shape) {
    case 'diamond':
      ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
      ctx.closePath(); break;
    case 'circle':
      ctx.arc(0, 0, s * 0.82, 0, Math.PI * 2); break;
    case 'square':
      var hs = s * 0.72, rd = 5;
      ctx.moveTo(-hs + rd, -hs);
      ctx.lineTo(hs - rd, -hs); ctx.quadraticCurveTo(hs, -hs, hs, -hs + rd);
      ctx.lineTo(hs, hs - rd); ctx.quadraticCurveTo(hs, hs, hs - rd, hs);
      ctx.lineTo(-hs + rd, hs); ctx.quadraticCurveTo(-hs, hs, -hs, hs - rd);
      ctx.lineTo(-hs, -hs + rd); ctx.quadraticCurveTo(-hs, -hs, -hs + rd, -hs);
      ctx.closePath(); break;
    case 'triangle':
      ctx.moveTo(0, -s * 0.9); ctx.lineTo(s * 0.85, s * 0.65); ctx.lineTo(-s * 0.85, s * 0.65);
      ctx.closePath(); break;
    case 'hexagon':
      for (var i = 0; i < 6; i++) {
        var a = (Math.PI / 3) * i - Math.PI / 6;
        if (i === 0) ctx.moveTo(Math.cos(a) * s * 0.82, Math.sin(a) * s * 0.82);
        else ctx.lineTo(Math.cos(a) * s * 0.82, Math.sin(a) * s * 0.82);
      }
      ctx.closePath(); break;
    case 'star':
      for (var i2 = 0; i2 < 10; i2++) {
        var a2 = (Math.PI / 5) * i2 - Math.PI / 2;
        var rad = i2 % 2 === 0 ? s * 0.82 : s * 0.38;
        if (i2 === 0) ctx.moveTo(Math.cos(a2) * rad, Math.sin(a2) * rad);
        else ctx.lineTo(Math.cos(a2) * rad, Math.sin(a2) * rad);
      }
      ctx.closePath(); break;
  }
}

function drawGem(x, y, typeIdx, scale, alpha, isSelected, isHint, specialType) {
  var gem = GEM_TYPES[typeIdx];
  if (!gem) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  var s = GEM_SIZE / 2;

  // Glow
  if (isSelected) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20; }
  else if (specialType) { ctx.shadowColor = '#ffd200'; ctx.shadowBlur = 16; }
  else if (isHint) { ctx.shadowColor = gem.glow; ctx.shadowBlur = 14; }

  // Main shape
  ctx.fillStyle = gem.fill;
  ctx.strokeStyle = gem.stroke;
  ctx.lineWidth = 2;
  ctx.beginPath();
  drawGemShape(s, gem.shape);
  ctx.fill();
  ctx.stroke();

  // Shine
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.globalAlpha = alpha * 0.35;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-s * 0.2, -s * 0.2, s * 0.28, s * 0.2, -0.5, 0, Math.PI * 2);
  ctx.fill();

  // --- Special indicator overlay ---
  if (specialType) {
    ctx.globalAlpha = alpha * 0.9;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';

    if (specialType === 'row') {
      // Horizontal arrows
      var aw = s * 0.55, ah = s * 0.25;
      ctx.beginPath();
      ctx.moveTo(-aw, 0); ctx.lineTo(aw, 0);
      ctx.moveTo(aw - ah, -ah); ctx.lineTo(aw, 0); ctx.lineTo(aw - ah, ah);
      ctx.moveTo(-aw + ah, -ah); ctx.lineTo(-aw, 0); ctx.lineTo(-aw + ah, ah);
      ctx.stroke();
    } else if (specialType === 'col') {
      // Vertical arrows
      var aw2 = s * 0.55, ah2 = s * 0.25;
      ctx.beginPath();
      ctx.moveTo(0, -aw2); ctx.lineTo(0, aw2);
      ctx.moveTo(-ah2, aw2 - ah2); ctx.lineTo(0, aw2); ctx.lineTo(ah2, aw2 - ah2);
      ctx.moveTo(-ah2, -aw2 + ah2); ctx.lineTo(0, -aw2); ctx.lineTo(ah2, -aw2 + ah2);
      ctx.stroke();
    } else if (specialType === 'bomb') {
      // Cross / explosion symbol
      var bs = s * 0.45;
      ctx.beginPath();
      ctx.moveTo(-bs, -bs); ctx.lineTo(bs, bs);
      ctx.moveTo(bs, -bs); ctx.lineTo(-bs, bs);
      ctx.moveTo(-bs, 0); ctx.lineTo(bs, 0);
      ctx.moveTo(0, -bs); ctx.lineTo(0, bs);
      ctx.stroke();
      // Outer ring
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawBoard() {
  ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

  // Background
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.1)';
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
  }

  // Hover
  if (hoverCell && !animating && gameActive) {
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(hoverCell.c * CELL, hoverCell.r * CELL, CELL, CELL);
  }

  // Selection
  if (selected && gameActive) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.strokeRect(selected.c * CELL + 2, selected.r * CELL + 2, CELL - 4, CELL - 4);
  }

  // Gems
  if (cells.length > 0) {
    for (var r2 = 0; r2 < ROWS; r2++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        var cell = cells[r2][c2];
        if (cell.type < 0 || cell.type >= GEM_TYPES.length) continue;
        if (cell.scale <= 0) continue;
        var isSel = selected && selected.r === r2 && selected.c === c2;
        var isHint = hintGems && (
          (hintGems.r1 === r2 && hintGems.c1 === c2) ||
          (hintGems.r2 === r2 && hintGems.c2 === c2)
        );
        var sp = specials[r2] ? specials[r2][c2] : null;
        drawGem(cell.x, cell.y, cell.type, cell.scale, cell.alpha, isSel, isHint, sp);
      }
    }
  }

  // Particles
  for (var pi = 0; pi < particles.length; pi++) {
    var p = particles[pi];
    ctx.globalAlpha = p.life * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts
  for (var fi = 0; fi < floatingTexts.length; fi++) {
    var ft = floatingTexts[fi];
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// Game Loop
// ============================================================

var lastTime = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  var dt = Math.min((timestamp - lastTime) / 16.67, 3);
  lastTime = timestamp;

  if (cells.length > 0) {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = cells[r][c];
        var dx = cell.targetX - cell.x;
        var dy = cell.targetY - cell.y;
        if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) {
          cell.x += dx * 0.18 * dt;
          cell.y += dy * 0.18 * dt;
        } else {
          cell.x = cell.targetX;
          cell.y = cell.targetY;
        }
      }
    }
  }

  particles = particles.filter(function(p) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.06 * dt;
    p.life -= p.decay * dt; return p.life > 0;
  });

  floatingTexts = floatingTexts.filter(function(ft) {
    ft.y += ft.vy * dt; ft.life -= 0.018 * dt; return ft.life > 0;
  });

  if (gameActive && !animating && selected === null) {
    hintTimer += dt;
    if (hintTimer > 300 && !hintGems) hintGems = hasValidMoves();
  }

  drawBoard();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// Game Mechanics
// ============================================================

function sleep(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

async function animateSwap(r1, c1, r2, c2) {
  cells[r1][c1].targetX = c2 * CELL + CELL / 2;
  cells[r1][c1].targetY = r2 * CELL + CELL / 2;
  cells[r2][c2].targetX = c1 * CELL + CELL / 2;
  cells[r2][c2].targetY = r1 * CELL + CELL / 2;
  await sleep(220);
  var tmp = cells[r1][c1]; cells[r1][c1] = cells[r2][c2]; cells[r2][c2] = tmp;
  cells[r1][c1].targetX = c1 * CELL + CELL / 2;
  cells[r1][c1].targetY = r1 * CELL + CELL / 2;
  cells[r2][c2].targetX = c2 * CELL + CELL / 2;
  cells[r2][c2].targetY = r2 * CELL + CELL / 2;
}

async function processMatches() {
  comboCount = 0;
  var groups = findMatchGroups();

  while (groups.length > 0) {
    comboCount++;
    showCombo(comboCount);
    SFX.match(comboCount);

    // Build flat set of all matched cells
    var toClear = new Set();
    for (var g = 0; g < groups.length; g++) {
      for (var i = 0; i < groups[g].cells.length; i++) toClear.add(groups[g].cells[i]);
    }

    // Determine specials to create from match-4 and match-5+
    var specialsToCreate = [];
    for (var g2 = 0; g2 < groups.length; g2++) {
      var grp = groups[g2];
      if (grp.len >= 5) {
        // Match-5+: bomb (placed at middle)
        var midIdx = grp.cells[Math.floor(grp.cells.length / 2)];
        specialsToCreate.push({ idx: midIdx, stype: 'bomb', gemType: grp.type });
      } else if (grp.len === 4) {
        // Match-4: row or column clear
        var midIdx2 = grp.cells[Math.floor(grp.cells.length / 2)];
        var stype = grp.dir === 'h' ? 'row' : 'col';
        specialsToCreate.push({ idx: midIdx2, stype: stype, gemType: grp.type });
      }
    }

    // Remove special-creation positions from clear set (they survive as special gems)
    var specialPositions = new Set();
    for (var si = 0; si < specialsToCreate.length; si++) {
      var sp = specialsToCreate[si];
      toClear.delete(sp.idx);
      specialPositions.add(sp.idx);
    }

    // Check if any cleared cells contain existing specials -> trigger chain reaction
    var triggeredSpecials = false;
    var processed = new Set();
    var toProcess = [];
    toClear.forEach(function(idx) { toProcess.push(idx); });

    while (toProcess.length > 0) {
      var idx = toProcess.pop();
      if (processed.has(idx)) continue;
      processed.add(idx);
      var sr = Math.floor(idx / COLS), sc = idx % COLS;
      if (specials[sr] && specials[sr][sc]) {
        var spType = specials[sr][sc];
        triggeredSpecials = true;
        spawnLineParticles(sr, sc, spType);
        specials[sr][sc] = null;
        var fx = getSpecialEffect(sr, sc, spType);
        for (var fi = 0; fi < fx.length; fi++) {
          if (!toClear.has(fx[fi]) && !specialPositions.has(fx[fi])) {
            toClear.add(fx[fi]);
            toProcess.push(fx[fi]);
          }
        }
      }
    }

    if (triggeredSpecials) SFX.special();

    // Calculate points
    var points = toClear.size * 10 * comboCount;
    // Bonus points for specials created
    points += specialsToCreate.length * 50;

    // Spawn particles on cleared gems
    toClear.forEach(function(idx) {
      var rr = Math.floor(idx / COLS), cc2 = idx % COLS;
      var cl = cells[rr][cc2];
      if (cl.type >= 0 && cl.type < GEM_TYPES.length) {
        spawnParticles(cl.x, cl.y, GEM_TYPES[cl.type].glow, 8);
      }
    });

    // Floating score text
    var allIdx = [];
    toClear.forEach(function(idx) { allIdx.push(idx); });
    if (allIdx.length > 0) {
      var centIdx = allIdx[Math.floor(allIdx.length / 2)];
      var cr = Math.floor(centIdx / COLS), cc3 = centIdx % COLS;
      spawnFloatingText(cc3 * CELL + CELL / 2, cr * CELL + CELL / 2, '+' + points, '#ffd200');
    }

    await sleep(180);

    // Clear matched gems
    toClear.forEach(function(idx) {
      var rr = Math.floor(idx / COLS), cc4 = idx % COLS;
      grid[rr][cc4] = -1;
      cells[rr][cc4].type = -1;
      cells[rr][cc4].scale = 0;
      specials[rr][cc4] = null;
    });

    // Create special gems (they stay on the board with their color)
    for (var si2 = 0; si2 < specialsToCreate.length; si2++) {
      var sp2 = specialsToCreate[si2];
      var spr = Math.floor(sp2.idx / COLS), spc = sp2.idx % COLS;
      grid[spr][spc] = sp2.gemType;
      cells[spr][spc].type = sp2.gemType;
      cells[spr][spc].scale = 1;
      cells[spr][spc].alpha = 1;
      specials[spr][spc] = sp2.stype;
    }

    addScore(points);
    await sleep(200);

    // Gravity: collapse gems down and fill from top
    for (var col = 0; col < COLS; col++) {
      var columnGems = [];
      for (var row = ROWS - 1; row >= 0; row--) {
        if (grid[row][col] !== -1) {
          columnGems.push({
            type: grid[row][col],
            special: specials[row][col],
            prevX: cells[row][col].x,
            prevY: cells[row][col].y
          });
        }
      }
      var emptyCount = ROWS - columnGems.length;

      for (var ci = 0; ci < columnGems.length; ci++) {
        var targetRow = ROWS - 1 - ci;
        grid[targetRow][col] = columnGems[ci].type;
        specials[targetRow][col] = columnGems[ci].special;
        cells[targetRow][col].type = columnGems[ci].type;
        cells[targetRow][col].x = columnGems[ci].prevX;
        cells[targetRow][col].y = columnGems[ci].prevY;
        cells[targetRow][col].targetX = col * CELL + CELL / 2;
        cells[targetRow][col].targetY = targetRow * CELL + CELL / 2;
        cells[targetRow][col].scale = 1;
        cells[targetRow][col].alpha = 1;
      }

      for (var ei = 0; ei < emptyCount; ei++) {
        var fillRow = emptyCount - 1 - ei;
        var newType = randomType();
        grid[fillRow][col] = newType;
        specials[fillRow][col] = null;
        cells[fillRow][col].type = newType;
        cells[fillRow][col].x = col * CELL + CELL / 2;
        cells[fillRow][col].y = -(ei + 1) * CELL;
        cells[fillRow][col].targetX = col * CELL + CELL / 2;
        cells[fillRow][col].targetY = fillRow * CELL + CELL / 2;
        cells[fillRow][col].scale = 1;
        cells[fillRow][col].alpha = 1;
      }
    }

    SFX.drop();
    await sleep(400);
    groups = findMatchGroups();
  }

  comboEl.style.opacity = '0';

  if (!hasValidMoves()) {
    showMessage('No moves! Shuffling...', 1200);
    await sleep(1400);
    shuffleBoard();
  }
}

function shuffleBoard() {
  var types = [], specs = [];
  for (var r = 0; r < ROWS; r++)
    for (var c = 0; c < COLS; c++) {
      types.push(grid[r][c]);
      specs.push(specials[r][c]);
    }
  for (var i = types.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = types[i]; types[i] = types[j]; types[j] = t;
    var s = specs[i]; specs[i] = specs[j]; specs[j] = s;
  }
  var idx = 0;
  for (var r2 = 0; r2 < ROWS; r2++)
    for (var c2 = 0; c2 < COLS; c2++) {
      grid[r2][c2] = types[idx];
      specials[r2][c2] = specs[idx];
      idx++;
    }
  initCells();
  if (!hasValidMoves()) createGrid();
}

function addScore(points) {
  score += points;
  scoreDisplay.textContent = score;
  var progress = Math.min(score / levelTarget * 100, 100);
  levelBar.style.width = progress + '%';
  if (score >= levelTarget) levelUp();
  if (score > bestScore) {
    bestScore = score;
    bestDisplay.textContent = bestScore;
    try { localStorage.setItem('gemcrush_best', String(bestScore)); } catch(e) {}
  }
}

function levelUp() {
  level++;
  movesLeft += 5;
  levelTarget = level * 1000;
  levelDisplay.textContent = level;
  movesDisplay.textContent = movesLeft;
  levelText.textContent = 'Score ' + levelTarget + ' to reach Level ' + (level + 1);
  showMessage('Level ' + level + '!', 1500);
  SFX.levelUp();
}

// ============================================================
// Input Handling
// ============================================================

function getCellFromPointer(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  var sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  var x = (clientX - rect.left) * sx, y = (clientY - rect.top) * sy;
  var c = Math.floor(x / CELL), r = Math.floor(y / CELL);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r: r, c: c };
  return null;
}

var dragStart = null;

canvas.addEventListener('mousemove', function(e) {
  hoverCell = getCellFromPointer(e.clientX, e.clientY);
});
canvas.addEventListener('mouseleave', function() { hoverCell = null; });

canvas.addEventListener('mousedown', function(e) {
  if (animating || !gameActive) return;
  dragStart = getCellFromPointer(e.clientX, e.clientY);
});

canvas.addEventListener('mouseup', function(e) {
  if (animating || !gameActive || !dragStart) return;
  var cell = getCellFromPointer(e.clientX, e.clientY);
  if (!cell) { dragStart = null; return; }
  if (Math.abs(cell.r - dragStart.r) + Math.abs(cell.c - dragStart.c) === 1) {
    trySwap(dragStart.r, dragStart.c, cell.r, cell.c);
  } else {
    handleClick(dragStart);
  }
  dragStart = null;
});

var touchStart = null, touchStartPos = null;

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (animating || !gameActive) return;
  var t = e.touches[0];
  touchStart = getCellFromPointer(t.clientX, t.clientY);
  touchStartPos = { x: t.clientX, y: t.clientY };
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!touchStart || !touchStartPos || animating || !gameActive) return;
  var t = e.touches[0];
  var dx = t.clientX - touchStartPos.x, dy = t.clientY - touchStartPos.y;
  if (Math.sqrt(dx * dx + dy * dy) > 20) {
    var sr = 0, sc = 0;
    if (Math.abs(dx) > Math.abs(dy)) sc = dx > 0 ? 1 : -1;
    else sr = dy > 0 ? 1 : -1;
    var tr = touchStart.r + sr, tc = touchStart.c + sc;
    if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS)
      trySwap(touchStart.r, touchStart.c, tr, tc);
    touchStart = null; touchStartPos = null;
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (!touchStart || animating || !gameActive) { touchStart = null; touchStartPos = null; return; }
  handleClick(touchStart);
  touchStart = null; touchStartPos = null;
}, { passive: false });

function handleClick(cell) {
  if (!selected) {
    selected = cell; SFX.select();
    hintGems = null; hintTimer = 0;
    return;
  }
  if (Math.abs(cell.r - selected.r) + Math.abs(cell.c - selected.c) === 1) {
    trySwap(selected.r, selected.c, cell.r, cell.c);
  } else {
    selected = cell; SFX.select();
    hintGems = null; hintTimer = 0;
  }
}

async function trySwap(r1, c1, r2, c2) {
  animating = true;
  selected = null; hintGems = null; hintTimer = 0;

  SFX.swap();
  swapGrid(r1, c1, r2, c2);
  await animateSwap(r1, c1, r2, c2);

  if (findMatches().size === 0) {
    SFX.badSwap();
    swapGrid(r1, c1, r2, c2);
    await animateSwap(r1, c1, r2, c2);
    animating = false;
    return;
  }

  movesLeft--;
  movesDisplay.textContent = movesLeft;
  await processMatches();
  animating = false;
  if (movesLeft <= 0) gameOver();
}

// ============================================================
// Game Flow
// ============================================================

function startGame() {
  score = 0; level = 1; movesLeft = 30; levelTarget = 1000;
  comboCount = 0; selected = null; hintGems = null; hintTimer = 0;
  animating = false; particles = []; floatingTexts = [];
  scoreDisplay.textContent = '0';
  levelDisplay.textContent = '1';
  movesDisplay.textContent = '30';
  levelBar.style.width = '0%';
  levelText.textContent = 'Score 1000 to reach Level 2';
  createGrid();
  overlay.classList.add('hidden');
  gameActive = true;
}

function gameOver() {
  gameActive = false;
  SFX.gameOver();
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = 'Final Score: ' + score + ' | Level: ' + level;
  overlayBtn.textContent = 'Play Again';
  setTimeout(function() { overlay.classList.remove('hidden'); }, 800);
}

overlayBtn.addEventListener('click', function() {
  ensureAudio();
  SFX.buttonClick();
  startGame();
});

requestAnimationFrame(gameLoop);
</script>
